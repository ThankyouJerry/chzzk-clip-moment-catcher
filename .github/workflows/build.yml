name: QA and Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm build.spec
      - name: Smoke-check package
        shell: pwsh
        run: ./smoke_windows.ps1
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path dist\ChzzkClipMomentCatcher\* -DestinationPath ChzzkClipMomentCatcher-Windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChzzkClipMomentCatcher-Windows-x86_64
          path: ChzzkClipMomentCatcher-Windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm build.spec
      - name: Apply ad-hoc signature and verify bundle
        run: |
          chmod +x package_macos.sh
          ./package_macos.sh dist/ChzzkClipMomentCatcher.app ChzzkClipMomentCatcher-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChzzkClipMomentCatcher-macOS-${{ matrix.arch }}
          path: ChzzkClipMomentCatcher-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ChzzkClipMomentCatcher-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Windows x86_64와 macOS Intel/Apple Silicon 빌드입니다.

            macOS 앱은 ad-hoc 서명 빌드이며 Apple 공증은 적용되지 않았습니다. 처음 실행할 때 macOS 보안 확인이 필요할 수 있습니다.
          files: |
            ChzzkClipMomentCatcher-Windows-x86_64.zip
            ChzzkClipMomentCatcher-macOS-x86_64.zip
            ChzzkClipMomentCatcher-macOS-arm64.zip
